name: rebellion
description: A linter for Flutter's ARB files. Analyze ARB files and find possible issues, find missing translations and sort ARB files
version: 0.1.1
repository: https://github.com/rebelappstudio/rebellion

executables:
  rebellion: main

topics:
  - localization
  - l10n
  - lints
  - analysis
  - analyzer

environment:
  sdk: ^3.10.8

dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  path: ^1.9.1
  yaml: ^3.1.3
  analyzer: ^10.0.2
  json_events: ^1.2.2
  file: ^7.0.1
  meta: ^1.18.1
  equatable: ^2.0.8

dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0
